<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoveArr</title>
<style>
    :root {
        --bg: hsl(222 40% 7%);
        --surface: hsl(222 32% 12%);
        --surface-2: hsl(222 30% 17%);
        --border: hsl(222 25% 22%);
        --text: hsl(220 25% 92%);
        --text-2: hsl(220 15% 62%);
        --text-3: hsl(220 12% 45%);
        --accent: hsl(238 84% 67%);
        --green: hsl(152 60% 44%);
        --red: hsl(0 72% 55%);
        --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
        padding: 16px 32px;
        background: hsl(222 40% 7% / .85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }

    .logo {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -.02em;
    }
    .logo span { color: var(--accent); }

    .tabs {
        display: flex;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px;
    }
    .tabs button {
        border: 0;
        background: transparent;
        color: var(--text-2);
        font: inherit;
        font-weight: 600;
        padding: 5px 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    .tabs button.active {
        background: var(--accent);
        color: white;
    }

    .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
    }
    .controls select, .controls .dir {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
    }

    .stats {
        font-size: 12px;
        color: var(--text-2);
        white-space: nowrap;
    }
    .stats strong { color: var(--text); font-weight: 600; }

    main { padding: 28px 32px 64px; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(154px, 1fr));
        gap: 24px 16px;
    }

    .card { cursor: default; }

    .poster {
        position: relative;
        aspect-ratio: 2 / 3;
        border-radius: var(--radius);
        overflow: hidden;
        background: linear-gradient(160deg, var(--surface-2), var(--surface));
        box-shadow: 0 1px 3px hsl(0 0% 0% / .5);
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover .poster {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px hsl(0 0% 0% / .55);
    }
    .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .badge {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--green);
        color: white;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px hsl(0 0% 0% / .5);
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px;
        background: linear-gradient(to top, hsl(222 40% 5% / .92) 20%, transparent 70%);
        opacity: 0;
        transition: opacity .15s ease;
    }
    .card:hover .overlay, .card:focus-within .overlay { opacity: 1; }

    .btn {
        border: 0;
        font: inherit;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        width: 100%;
        background: hsl(222 25% 92% / .12);
        color: var(--text);
        backdrop-filter: blur(4px);
    }
    .btn:hover { background: hsl(222 25% 92% / .2); }
    .btn.danger:hover, .btn.arm { background: var(--red); color: white; }
    .btn:disabled { opacity: .5; cursor: wait; }

    .who {
        font-size: 12px;
        line-height: 1.4;
        color: hsl(220 15% 72%);
        text-align: center;
        width: 100%;
    }
    .who b { color: var(--text); font-weight: 600; }

    .meta { padding: 8px 2px 0; }
    .meta .title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .meta .sub {
        font-size: 12px;
        color: var(--text-2);
    }
    .meta .watched { color: var(--text-3); font-size: 12px; }

    dialog {
        margin: auto;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
        padding: 0;
        width: min(440px, calc(100vw - 32px));
        box-shadow: 0 24px 64px hsl(0 0% 0% / .6);
    }
    dialog::backdrop { background: hsl(222 40% 4% / .7); backdrop-filter: blur(3px); }
    .dialog-head {
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--border);
    }
    .dialog-head h2 { font-size: 19px; font-weight: 700; }
    .dialog-head p { font-size: 12px; color: var(--text-2); }
    .season-list { list-style: none; padding: 8px; max-height: 60vh; overflow-y: auto; }
    .season-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
    }
    .season-list li:hover { background: var(--surface-2); }
    .season-list .name { font-weight: 600; }
    .season-list .who-line { font-size: 12px; color: var(--text-3); }
    .season-list .info { color: var(--text-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
    .season-list .btn { width: auto; background: var(--surface-2); }
    .season-list .btn:hover { background: var(--red); color: white; }

    .empty {
        text-align: center;
        color: var(--text-2);
        padding: 96px 0;
    }

    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        translate: -50%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 10px 18px;
        border-radius: 10px;
        box-shadow: 0 8px 24px hsl(0 0% 0% / .5);
        opacity: 0;
        transition: opacity .2s;
        pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { border-color: var(--red); }
</style>
</head>
<body>

<header>
    <div class="logo">Remove<span>Arr</span></div>
    <nav class="tabs">
        <button data-tab="movies" class="active">Movies</button>
        <button data-tab="series">Series</button>
    </nav>
    <div class="controls">
        <select id="sort">
            <option value="size">Size</option>
            <option value="lastPlayed">Last watched</option>
            <option value="added">Date added</option>
            <option value="title">Title</option>
        </select>
        <button class="dir" id="dir" title="Toggle sort direction">↓</button>
    </div>
    <div class="stats" id="stats"></div>
</header>

<main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Nothing here.</div>
</main>

<dialog id="seasonDialog"></dialog>
<div class="toast" id="toast"></div>

<script>
    const state = { tab: 'movies', sort: 'size', desc: true, data: { movies: [], series: [] } };

    const $ = id => document.getElementById(id);
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const gb = bytes => (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
    const dateFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const watchedText = ts => ts ? 'Watched ' + dateFmt.format(ts * 1000) : 'Unwatched';

    function sorted(items) {
        const key = state.sort;
        return [...items].sort((a, b) => {
            // never-watched items always sink to the bottom when sorting by watch date
            if (key === 'lastPlayed' && !a.lastPlayed !== !b.lastPlayed) return a.lastPlayed ? -1 : 1;

            let av = a[key], bv = b[key];
            if (key === 'added') { av = Date.parse(av); bv = Date.parse(bv); }
            if (key === 'title') return state.desc ? bv.localeCompare(av) : av.localeCompare(bv);

            return state.desc ? (bv ?? 0) - (av ?? 0) : (av ?? 0) - (bv ?? 0);
        });
    }

    function render() {
        const items = sorted(state.data[state.tab]);
        const isMovies = state.tab === 'movies';

        $('stats').innerHTML = `<strong>${items.length}</strong> items · <strong>${gb(items.reduce((a, i) => a + i.size, 0))}</strong>`;
        $('empty').hidden = items.length > 0;

        $('grid').innerHTML = items.map(item => `
            <div class="card" data-id="${item.id}" tabindex="0">
                <div class="poster">
                    <img src="/api/poster/${isMovies ? 'movie' : 'series'}/${item.id}" loading="lazy" alt=""
                         onerror="this.remove()">
                    ${item.lastPlayed ? '<div class="badge" title="' + watchedText(item.lastPlayed) + '">✓</div>' : ''}
                    <div class="overlay">
                        <div class="who">
                            ${item.requestedBy ? `<div>Requested by <b>${esc(item.requestedBy)}</b></div>` : ''}
                            ${item.watchedBy.length ? `<div>Watched by <b>${esc(item.watchedBy.join(', '))}</b></div>` : ''}
                        </div>
                        ${isMovies
                            ? `<button class="btn danger" data-del="${item.id}">Delete</button>`
                            : `<button class="btn" data-seasons="${item.id}">Manage seasons</button>`}
                    </div>
                </div>
                <div class="meta">
                    <div class="title" title="${esc(item.title)}">${esc(item.title)}</div>
                    <div class="sub">${item.year} · ${gb(item.size)}</div>
                    <div class="watched">${watchedText(item.lastPlayed)}</div>
                </div>
            </div>
        `).join('');
    }

    function toast(message, isError = false) {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    // two-step delete: first click arms the button, second click within 3s fires
    function armed(button) {
        if (button.classList.contains('arm')) return true;
        button.classList.add('arm');
        const label = button.textContent;
        button.textContent = 'Sure?';
        setTimeout(() => { button.classList.remove('arm'); button.textContent = label; }, 3000);
        return false;
    }

    async function apiDelete(url, button, onDone) {
        button.disabled = true;
        const response = await fetch(url, { method: 'DELETE' });
        button.disabled = false;

        if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            return toast(body.error ?? 'Delete failed', true);
        }
        onDone();
    }

    document.addEventListener('click', event => {
        const delBtn = event.target.closest('[data-del]');
        if (delBtn && armed(delBtn)) {
            const id = Number(delBtn.dataset.del);
            const movie = state.data.movies.find(m => m.id === id);
            apiDelete(`/api/movie/${id}`, delBtn, () => {
                state.data.movies = state.data.movies.filter(m => m.id !== id);
                toast(`Deleted ${movie.title}`);
                render();
            });
        }

        const seasonsBtn = event.target.closest('[data-seasons]');
        if (seasonsBtn) openSeasons(Number(seasonsBtn.dataset.seasons));

        const seasonDel = event.target.closest('[data-season-del]');
        if (seasonDel && armed(seasonDel)) {
            const seriesId = Number(seasonDel.dataset.series);
            const seasonNumber = Number(seasonDel.dataset.seasonDel);
            const series = state.data.series.find(s => s.id === seriesId);
            apiDelete(`/api/series/${seriesId}/season/${seasonNumber}`, seasonDel, () => {
                series.seasons = series.seasons.filter(s => s.seasonNumber !== seasonNumber);
                series.size = series.seasons.reduce((a, s) => a + s.size, 0);
                if (series.seasons.length === 0) state.data.series = state.data.series.filter(s => s.id !== seriesId);
                toast(`Deleted ${series.title} – Season ${seasonNumber}`);
                series.seasons.length ? openSeasons(seriesId) : $('seasonDialog').close();
                render();
            });
        }
    });

    function openSeasons(id) {
        const series = state.data.series.find(s => s.id === id);
        const dialog = $('seasonDialog');
        dialog.innerHTML = `
            <div class="dialog-head">
                <h2>${esc(series.title)}</h2>
                <p>${series.seasons.length} seasons · ${gb(series.size)}${series.requestedBy ? ` · Requested by ${esc(series.requestedBy)}` : ''}</p>
            </div>
            <ul class="season-list">
                ${series.seasons.map(season => `
                    <li>
                        <div>
                            <div class="name">Season ${season.seasonNumber}</div>
                            ${season.watchedBy.length ? `<div class="who-line">Watched by ${esc(season.watchedBy.join(', '))}</div>` : ''}
                        </div>
                        <span class="info">${season.episodes} ep · ${gb(season.size)}</span>
                        <button class="btn" data-series="${id}" data-season-del="${season.seasonNumber}">Delete</button>
                    </li>
                `).join('')}
            </ul>
        `;
        if (!dialog.open) dialog.showModal();
    }

    $('seasonDialog').addEventListener('click', e => {
        if (e.target === e.currentTarget) e.currentTarget.close();
    });

    document.querySelectorAll('.tabs button').forEach(button =>
        button.addEventListener('click', () => {
            document.querySelector('.tabs .active').classList.remove('active');
            button.classList.add('active');
            state.tab = button.dataset.tab;
            render();
        })
    );

    $('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
    $('dir').addEventListener('click', e => {
        state.desc = !state.desc;
        e.target.textContent = state.desc ? '↓' : '↑';
        render();
    });

    fetch('/api/library')
        .then(r => r.ok ? r.json() : Promise.reject(new Error('Failed to load library')))
        .then(data => { state.data = data; render(); })
        .catch(err => toast(err.message, true));
</script>
</body>
</html>
