services:
  removearr:
    image: nandi95/removearr:main
    container_name: removearr
    env_file: .env
    ports:
      - "8484:8484"
    volumes:
      # named volume: the container runs as `node`, a bind mount would be root-owned and sqlite could not open it
      - removearr-data:/app/.data
    restart: unless-stopped

volumes:
  removearr-data:
